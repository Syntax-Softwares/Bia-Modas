services:
  app:
    build: .
    ports:
      - "8080:80" # host:container
    volumes:
      - .:/var/www/html
    environment:
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: biamodas
      MARIADB_USER: syntax
      MARIADB_PASSWORD: Syntax@123
      TZ: America/Sao_Paulo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
      # Executado automaticamente so na primeira subida (volume vazio).
      # Para recriar o banco do zero:
      #   docker compose down -v && docker compose up -d --build
      - ./db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed_db.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mariadb_data:
