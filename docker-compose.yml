services:
  app:
    build: .
    ports:
      - "8080:80" #meupc:container
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: biamodas
      MARIADB_USER: syntax
      MARIADB_PASSWORD: Syntax@123
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: